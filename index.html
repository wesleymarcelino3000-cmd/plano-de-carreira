<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InnoCarrer - Painel por Setor</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div id="login" class="login">
  <div class="login-card">
    <div class="logo-login">
      <img src="logo_inno_life.webp" alt="Logo InnoCarrer">
    </div>
    <h1>InnoCarrer</h1>
    <p>Gestão Interna por Setor</p>
    <input id="email" placeholder="Email">
    <input id="senha" type="password" placeholder="Senha">
    <button onclick="login()">Entrar</button>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="logo-box">
      <img src="logo_inno_life.webp" class="logo-img" alt="Logo InnoCarrer">
    </div>
    <h2>INNOLIFE</h2>
    <small id="userInfo">Carregando...</small>

    <button onclick="nav('dashboard')"><span>📊</span> Dashboard</button>
    <button onclick="nav('sac')" data-setor="SAC"><span>🎧</span> SAC</button>
    <button onclick="nav('logistica')" data-setor="Logística"><span>🚚</span> Logística</button>
    <button onclick="nav('vendas')" data-setor="Vendas"><span>🛒</span> Vendas</button>
    <button onclick="nav('marketing')" data-setor="Marketing"><span>📣</span> Marketing</button>
    <button onclick="nav('ranking')"><span>🏆</span> Ranking</button>
    <button onclick="nav('metas')" id="btnMetas"><span>🎯</span> Metas / Bônus</button>
    <button onclick="nav('metasIndividuais')" id="btnMetasIndividuais"><span>👥</span> Metas Individuais <small class="admin-tag">ADMIN</small></button>
    <button onclick="nav('criarUsuario')" id="btnCriarUsuario"><span>👤</span> Criar Usuário <small class="admin-tag">ADMIN</small></button>
    <button onclick="nav('editarMeuUsuario')"><span>✏️</span> Editar Meu Usuário</button>
    <button onclick="nav('planoCarreira')"><span>📈</span> Plano de Carreira</button>
    <hr class="menu-line">
    <button onclick="logout()" class="btn-sair"><span>🚪</span> Sair</button>
  </aside>

  <main class="content">
    <h1 id="title">Dashboard</h1>
    <div id="page"></div>
  </main>
</div>

<script src="supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
